[workspace]
members = [
    "crates/ferritin",
    "crates/ferritin-bevy",
    # "crates/ferritin-cellscape",
    "crates/ferritin-core",
    "crates/ferritin-examples",
    # "crates/ferritin-molviewspec",
    "crates/ferritin-onnx-models",
    "crates/ferritin-plms",
    # "crates/ferritin-pymol",
    "crates/ferritin-structure-mesh",
    "crates/ferritin-test-data",
    # "crates/ferritin-wasm-examples/ligandmpnn",
    # "crates/ferritin-wasm-examples/ligandmpnn-wasm",
]
resolver = "3"

[workspace.package]
version = "0.3.4-dev"
authors = ["Zach Charlop-Powers<zach.charlop.powers@gmail.com>"]
description = "Protein Manipulation and visualization tools"
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
bevy = { version = "0.19", default-features = false }
bon = "3.9.3"
candle-core =  "0.10.2"
candle-metal-kernels = "0.10.2"
candle-nn = "0.10.2"
candle-onnx = "0.10.2"
candle-transformers = "0.10.2"
clap = { version = "4.6.1", features = ["derive"] }
hf-hub = { version = "1.0.0-rc.1", features = ["blocking"] }
itertools = "0.15.0"
ndarray = "0.17.2"
ort = "2.0.0-rc.12"
rerun = "0.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27.0"
tokenizers = { version = "0.23.1", features = ["onig"] }

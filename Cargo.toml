[workspace]
# The LigandMPNN WASM example stubs (crates/ferritin-wasm-examples) were removed
# in ferritin-8q9; a real WASM consumer of ferritin-core is tracked in ferritin-5vb.
members = [
    "crates/ferritin",
    "crates/ferritin-bevy",
    "crates/ferritin-cellscape",
    "crates/ferritin-core",
    "crates/ferritin-examples",
    "crates/ferritin-molviewspec",
    "crates/ferritin-plms",
    # "crates/ferritin-pymol",
    "crates/ferritin-test-data",
]
resolver = "3"

[workspace.package]
version = "0.4.0-dev"
authors = ["Zach Charlop-Powers<zach.charlop.powers@gmail.com>"]
description = "Protein Manipulation and visualization tools"
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = "0.4"
compact_str = "0.10"
urlencoding = "2"
validator = { version = "0.21", features = ["derive"] }
bevy = { version = "0.20", default-features = false }
bon = "3.10.2"
candle-core =  "0.11.0"
candle-metal-kernels = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
hf-hub = { version = "1.0.0", features = ["blocking"] }
itertools = "0.15.0"
ndarray = "0.17.2"
rerun = "0.38"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27.0"
tokenizers = { version = "0.23.2", features = ["onig"] }

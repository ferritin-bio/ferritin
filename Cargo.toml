[workspace]
members = [
    "crates/ferritin",
    # "crates/ferritin-cellscape",
    "crates/ferritin-core",
    "crates/ferritin-examples",
    "crates/ferritin-molviewspec",
    "crates/ferritin-onnx-models",
    "crates/ferritin-plms",
    # "crates/ferritin-pymol",
    "crates/ferritin-structure-mesh",
    "crates/ferritin-test-data",
    "crates/ferritin-wasm-examples/ligandmpnn",
    "crates/ferritin-wasm-examples/ligandmpnn-wasm",
]
resolver = "2"

[workspace.package]
name = "ferritin"
version = "0.3.0-dev"
authors = ["Zach Charlop-Powers<zach.charlop.powers@gmail.com>"]
description = "Protein Manipulaton and visualization tools"
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
bevy = { version = "0.16.0-rc.3", default-features = false }
bon = "3.5.2"
candle-core = "*"
candle-metal-kernels = "*"
candle-nn = "*"
candle-onnx = "*"
candle-transformers = "*"
# candle-core = "=0.9.0-alpha.1"
# candle-metal-kernels = "=0.9.0-alpha.1"
# candle-nn = "=0.9.0-alpha.1"
# candle-onnx = "=0.9.0-alpha.1"
# candle-transformers = "=0.9.0-alpha.1"
chrono = "0.4"
clap = { version = "4.5.35", features = ["derive"] }
hf-hub = "0.4.2"
itertools = "0.14.0"
ndarray = "0.16"
ort = "=2.0.0-rc.9"
rand = "0.9.0"
re_viewer = "0.23.0-alpha.2"
rerun = "0.23.0-alpha.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3.19.1"
tokenizers = { version = "0.21.1", features = ["onig"] }
urlencoding = "2.1.3"
validator = { version = "0.20.0", features = ["derive"] }

[workspace]
members = [
    "crates/ferritin",
    # "crates/ferritin-cellscape",
    "crates/ferritin-core",
    "crates/ferritin-examples",
    # "crates/ferritin-molviewspec",
    "crates/ferritin-onnx-models",
    "crates/ferritin-plms",
    # "crates/ferritin-pymol",
    "crates/ferritin-structure-mesh",
    "crates/ferritin-test-data",
    # "crates/ferritin-wasm-examples/ligandmpnn",
    # "crates/ferritin-wasm-examples/ligandmpnn-wasm",
]
resolver = "3"

[workspace.package]
version = "0.3.3-dev"
authors = ["Zach Charlop-Powers<zach.charlop.powers@gmail.com>"]
description = "Protein Manipulation and visualization tools"
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
bevy = { version = "0.16.0", default-features = false }
bon = "3.6.3"
candle-core = "0.9.0"
candle-metal-kernels = "0.9.0"
candle-nn = "0.9.0"
candle-onnx = "0.9.0"
candle-transformers = "0.9.0"
clap = { version = "4.5.37", features = ["derive"] }
hf-hub = "0.4.2"
itertools = "0.14.0"
ndarray = "0.16"
ort = "=2.0.0-rc.9"
rerun = "0.23.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.27", features = ["derive"] }
tempfile = "3.19.1"
tokenizers = { version = "0.21.1", features = ["onig"] }

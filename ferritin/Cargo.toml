[package]
name = "ferritin"
version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = ["core"]                                                         # Only include core and io by default
core = ["dep:ferritin-core"]
io = ["dep:ferritin-io"]
bevy = ["dep:ferritin-bevy"]
plms = ["dep:ferritin-plms"]
full = ["core", "io", "bevy", "plms", "molviewspec", "cellscape", "pymol"]
molviewspec = ["dep:ferritin-molviewspec"]
cellscape = ["dep:ferritin-cellscape"]
pymol = ["dep:ferritin-pymol"]


[dependencies]
# Core is always included
ferritin-core = { path = "../crates/ferritin-core" }

# Optional dependencies
ferritin-io = { path = "../crates/ferritin-io", optional = true }
ferritin-bevy = { path = "../crates/ferritin-bevy", optional = true }
ferritin-plms = { path = "../crates/ferritin-plms", optional = true }
ferritin-molviewspec = { path = "../crates/ferritin-molviewspec", optional = true }
ferritin-cellscape = { path = "../crates/ferritin-cellscape", optional = true }
ferritin-pymol = { path = "../crates/ferritin-pymol", optional = true }

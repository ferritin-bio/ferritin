name: Tests
on:
  pull_request:
  push:
    branches:
      - "main"

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install ALSA development package
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev protobuf-compiler

      - name: Configure cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Run Build
        run: cargo build

      - name: Check all targets (examples, tests, benches)
        run: cargo check --workspace --all-targets

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The rendered docs carry the model support matrix, so they are something
      # users read. Warning noise there makes a real regression easy to miss
      # (ferritin-100.26).
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check rerun-gated code
        run: cargo check -p ferritin-bevy --features rerun

      - name: Check rerun example
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo check -p ferritin-examples --features rerun --example rerun

      - name: Run tests
        run: cargo test --verbose

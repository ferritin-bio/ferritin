name: Nightly Parity

# Runs the full ferritin-plms test suite *including* the golden-fixture parity
# tests, which are gated off the PR path because they download model weights
# (AMPLIFY 120M ~500 MB, ESMC ~1.3 GB, ...) from Hugging Face. This job sets
# FERRITIN_HF_TESTS=1 and runs the ignored tests too, so silent numerical drift
# between the Candle ports and their Python references is caught here rather
# than never. A red run on this workflow is the intended signal.
on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  # Enables the HF-download-dependent parity tests (see
  # crates/ferritin-plms/tests/support/parity.rs::hf_tests_enabled).
  FERRITIN_HF_TESTS: "1"

jobs:
  parity:
    name: PLM parity (nightly)
    runs-on: ubuntu-latest
    # Weight downloads dominate; give the job plenty of headroom.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev protobuf-compiler

      - name: Configure cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-v1
          restore-keys: |
            hf-cache-${{ runner.os }}-

      - name: Run ferritin-plms suite incl. parity + ignored
        # Some ignored tests need gated weights (e.g. ESM3); provide a token via
        # the HF_TOKEN secret when available. Absent it, those tests fail and the
        # nightly reports it — which is the point.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: cargo test -p ferritin-plms -- --include-ignored --nocapture

[package]
name = "ferritin-examples"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true

[features]
default = ["plms", "mesh", "bevy"]
bevy = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-metal-kernels"]
mesh = ["ferritin/mesh"]
plms = ["ferritin/plms"]
# rerun = ["dep:rerun", "ferritin-structure-mesh/rerun"]  # blocked: see workspace Cargo.toml
# all = ["mesh", "plms", "molviewspec"]
# all = ["mesh", "plms", "molviewspec"]
# molviewspec = ["ferritin/molviewspec"]
# pymol = ["ferritin/pymol"]

[dependencies]
ferritin = { path = "../ferritin", default-features = false }
anyhow.workspace = true
bevy = { workspace = true, default-features = true }
candle-core.workspace = true
candle-metal-kernels = { workspace = true, optional = true }
candle-nn.workspace = true
candle-onnx.workspace = true
clap.workspace = true
ferritin-core = { path = "../ferritin-core" }
ferritin-plms = { path = "../ferritin-plms" }
ferritin-onnx-models = { path = "../ferritin-onnx-models" }
ferritin-structure-mesh = { path = "../ferritin-structure-mesh" }
# rerun = { workspace = true, optional = true }  # blocked: see workspace Cargo.toml

# The metal feature is defined above, and we don't need to redefine it conditionally

[target.'cfg(target_os = "macos")'.dependencies]
candle-metal-kernels.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.23.1", default-features = false, features = [
    "unstable_wasm",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hf-hub.workspace = true
tokenizers = { version = "0.23.1" } # full features for non-wasm


[dev-dependencies]
ferritin-test-data = { path = "../ferritin-test-data" }


[[example]]
name = "bevy_basic_ball_and_stick"
path = "examples/bevy/basic_ball_and_stick.rs"
required-features = ["bevy"]

[[example]]
name = "bevy_basic_putty"
path = "examples/bevy/basic_putty.rs"
required-features = ["bevy"]

[[example]]
name = "bevy_basic_snapshot"
path = "examples/bevy/basic_snapshot.rs"
required-features = ["bevy"]

[[example]]
name = "bevy_basic_spheres"
path = "examples/bevy/basic_spheres.rs"
required-features = ["bevy"]

[[example]]
name = "bevy_screenshot"
path = "examples/bevy/screenshot.rs"
required-features = ["bevy"]

[[example]]
name = "rerun"
path = "examples/rerun/main.rs"
required-features = ["rerun"]

[[example]]
name = "amplify"
path = "examples/amplify/main.rs"

[[example]]
name = "esm2"
path = "examples/esm2/main.rs"

[[example]]
name = "esm3"
path = "examples/esm3/main.rs"

[[example]]
name = "esmc"
path = "examples/esmc/main.rs"

[[example]]
name = "esmfold2"
path = "examples/esmfold2/main.rs"

[[example]]
name = "ligandmpnn"
path = "examples/ligandmpnn/main.rs"
